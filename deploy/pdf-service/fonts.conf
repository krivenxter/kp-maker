<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- OTF-файлы Museo имеют внутренние имена с суффиксами начертаний. -->
  <alias>
    <family>Museo Sans Cyrl</family>
    <prefer>
      <family>Museo Sans Cyrl 300</family>
      <family>Museo Sans Cyrl 700</family>
    </prefer>
  </alias>
</fontconfig>
